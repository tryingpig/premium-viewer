<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premium Contents</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Premium">
<link rel="apple-touch-icon" href="icons/app-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>📚</text></svg>">
<link rel="stylesheet" href="style.css?v=14">
<script>
/* 테마는 그리기 전에 정해야 한다. 나중에 적용하면 밝은 화면이 한 번 번쩍인 뒤
   어두워져서, 밤에 보는 사람 눈이 부시다. 그래서 여기서 동기적으로 처리한다. */
(function () {
  try {
    var t = localStorage.getItem('pv-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="top" hidden>
  <a class="brand" href="#/">📚 <b>Premium</b> Contents</a>
  <nav class="chs" id="nav"></nav>
  <button class="icon" id="btn-theme" title="테마" aria-label="테마 바꾸기"></button>
  <button class="icon" id="btn-settings" title="설정" aria-label="설정">⚙</button>
</header>

<main id="view"><div class="boot">불러오는 중…</div></main>

<dialog id="gate">
  <form method="dialog" id="gate-form">
    <h2>🔑 접근 토큰</h2>
    <p class="hint">
      본문은 비공개 저장소 <code>tryingpig/premium-contents</code> 에 있습니다.
      읽기 권한이 있는 GitHub 토큰을 넣으면 이 브라우저에만 저장됩니다(localStorage).
    </p>
    <input id="gate-input" type="password" placeholder="github_pat_… 또는 ghp_…" autocomplete="off" spellcheck="false">
    <p class="err" id="gate-err" hidden></p>
    <div class="row">
      <button value="cancel" class="ghost" id="gate-cancel" type="button">닫기</button>
      <button value="ok" class="primary" id="gate-ok">확인</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=14"></script>
</body>
</html>
